global: { scrape_interval: 30s, evaluation_interval: 30s }
scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'api-gateway:8080', 'identity-user-service:8082', 'product-catalog-service:8083', 'order-inventory-service:8084', 'payment-billing-service:8085', 'notification-service:8086' ]
  - job_name: prometheus
    static_configs: [ { targets: [ 'localhost:9090' ] } ]
