spring:
  application:
    name: product-catalog-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:product_catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Performance/Scalability: service nay bi goi gRPC DONG BO boi Order & Inventory Service
    # cho TUNG item cua MOI don hang (checkStockAndPrice) - trong luc Flash Sale day la mot
    # trong nhung duong dan nong nhat he thong (ty le thuan voi so luong don hang/giay, cao
    # hon ca so request HTTP vao thang order-inventory-service neu 1 don co nhieu item). HikariCP
    # mac dinh 10 ket noi la qua it, se khien gRPC call bi cho connection -> keo dai latency
    # tao don hang day (vi goi gRPC nay nam TRUOC buoc giu kho trong OrderServiceImpl.createOrder()).
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: ProductCatalogHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  grpc:
    server:
      # PHAI dong bo voi order-inventory-service: client ben do tro toi PRODUCT_GRPC_PORT
      # (xem grpc.client.channels.product-catalog-service.address trong application.yml cua
      # order-inventory-service) - dung CHUNG 1 bien moi truong de khong bi lech port khi doi.
      port: ${PRODUCT_GRPC_PORT:9091}

jwt:
  secret-key: ${JWT_SECRET_KEY}

server:
  port: 8083

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

logging:
  level:
    com.quickbite.edu: INFO