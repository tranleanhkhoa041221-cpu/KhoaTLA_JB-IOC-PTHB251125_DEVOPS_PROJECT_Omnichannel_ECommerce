syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.quickbite.edu.grpc";

package com.quickbite.edu.grpc;

service IdentityService {
  rpc GetUser(UserRequest) returns (UserResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetDefaultAddress(GetDefaultAddressRequest) returns (AddressResponse);
  rpc GetUserContact(GetUserContactRequest) returns (UserContactResponse);
}

message UserRequest {
  string username = 1;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string role = 3;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
  string role = 4;
}

message GetDefaultAddressRequest {
  int64 user_id = 1;
}

message AddressResponse {
  int64 id = 1;
  int64 user_id = 2;
  string recipient_name = 3;
  string phone = 4;
  string province = 5;
  string district = 6;
  string ward = 7;
  string address_detail = 8;
  bool is_default = 9;
}

message GetUserContactRequest {
  int64 user_id = 1;
}

message UserContactResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  string phone = 5;
}
