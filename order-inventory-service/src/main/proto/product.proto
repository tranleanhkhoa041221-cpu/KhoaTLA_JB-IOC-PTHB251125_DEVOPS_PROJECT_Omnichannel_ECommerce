syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.quickbite.edu.grpc";

package com.quickbite.edu.grpc;

service ProductService {
  rpc GetProductById(ProductByIdRequest) returns (ProductResponse);
  rpc GetVariantBySku(VariantBySkuRequest) returns (VariantResponse);
  rpc CheckStockAndPrice(CheckStockRequest) returns (CheckStockResponse);
}

message ProductByIdRequest {
  int64 id = 1;
}

message VariantBySkuRequest {
  string sku = 1;
}

message ProductResponse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  double basePrice = 4;
  string status = 5;
  int64 categoryId = 6;
  int64 brandId = 7;
}

message VariantResponse {
  int64 id = 1;
  int64 productId = 2;
  string productName = 3;
  string sku = 4;
  double price = 5;
  int32 stockQuantity = 6;
  string attributes = 7;
}

message CheckStockRequest {
  string sku = 1;
  int32 quantity = 2;
}

message CheckStockResponse {
  bool available = 1;
  double price = 2;
  string productName = 3;
  string message = 4;
}